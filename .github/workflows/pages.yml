name: Publish report to GitHub Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Called after reports pushes new commits; resolve the branch again.
          ref: ${{ github.ref_name }}
      - name: Prepare docs site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp docs/*.html docs/*.js docs/history.json "$RUNNER_TEMP/site/"
          mkdir -p "$RUNNER_TEMP/site/WorkerVersions"
          cp WorkerVersions/README.md WorkerVersions/workers.json "$RUNNER_TEMP/site/WorkerVersions/"
          sed 's|content="../WorkerVersions/"|content="./WorkerVersions/"|' docs/index.html > "$RUNNER_TEMP/site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        id: deployment
