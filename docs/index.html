<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefox-CI Workers Versions History</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.min.css"
    integrity="sha512-zb2pp+R+czM7GAemdSUQt6jFmr3qCo6ikvBgVU6F5GvwEDR0C2sefFiPEJ9QUpmAKdD5EqDUdNRtbOYnbF/eyQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/gh/tofsjonas/sortable/sortable-base.min.css" rel="stylesheet" />
  <style>
    #__quick_nav {
      top: auto !important;
      right: 8px !important;
      bottom: 8px !important;
      left: auto !important;
      font-size: 0 !important;
    }

    #__quick_nav::after {
      content: "Quick";
      font: 600 12px/1 system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
    }

    main {
      margin: 20px 40px;
    }

    .content-column {
      margin-right: 250px;
    }

    .toc {
      position: fixed;
      right: 15px;
      top: 5px;
      max-height: calc(100vh - 40px);
      max-width: 300px;
      overflow-y: auto;
      background: #fff;
      padding: 15px 25px;
      border: 1px solid #eee;
      z-index: 1;
    }

    .toc ul {
      margin-left: 20px;
      padding-left: 0;
    }

    .toc ul ul {
      margin-left: auto;
      padding-left: 15px;
    }

    @media screen and (max-width: 1400px) {
      .content-column {
        margin-right: 0;
      }

      .toc {
        position: static;
        max-height: none;
        max-width: none;
        margin-bottom: 20px;
      }
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .history {
      margin-top: 20px;
    }

    .graphs {
      margin-top: 40px;
      border-top: 1px solid #eee;
      padding-top: 30px;
    }

    .info {
      padding: 8px 2px;
      color: #555;
      font-size: 14px;
      width: 70%;
    }
  </style>
</head>

<body>

  <div class="markdown-body">
    <main>
      <nav id="toc" class="toc" aria-label="Table of contents">
        <strong>Contents</strong>
        <ul id="toc-list"></ul>
      </nav>
      <div class="content-column">
        <div id="content"></div>
        <div class="history" id="history-content"></div>
        <div class="graphs" id="graphs-content">
          <h2>Graphs</h2>
          <p class="info">Each point shows the number of worker pools observed in a snapshot.</p>
          <h3>Worker pools by implementation</h3>
          <div id="graph-implementations"></div>
          <h3>Worker pools by version</h3>
          <div id="graph-versions"></div>
        </div>
      </div>
    </main>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"
    integrity="sha512-LhccdVNGe2QMEfI3x4DVV3ckMRe36TfydKss6mJpdHjNFiV07dFpS2xzeZedptKZrwxfICJpez09iNioiSZ3hA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/gh/tofsjonas/sortable/sortable.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.18.0.min.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
